interface:
  display_name: "correct"
  short_description: "Find the mistakes agents keep repeating in this repo and make each one impossible. Try architecture first, then types, then a lint whose error names the fix, then a test, and write docs last. Prove each check fails on a real past mistake. Repeat this each time the user corrects you."
  default_prompt: "Use $correct for this task."

policy:
  allow_implicit_invocation: false
