interface:
  display_name: "engineering-mode"
  short_description: "Use when starting a software task that needs rigor: a bug, feature, refactor, investigation, performance issue, or any multi-step change to code that will be kept. Picks one playbook, routes to the matching principle skills and power-of-ten, and proves the result on the real artifact. Skip for casual questions, throwaway scripts, or when the user opts out."
  default_prompt: "Use $engineering-mode for this task."

policy:
  allow_implicit_invocation: true
