interface:
  display_name: "Fix All Issues"
  short_description: "Fresh-context PR review rounds with tree-bound evidence and gated fixes."
  default_prompt: "Use $fix-all-issues in exhaustive mode. Keep the main agent orchestration-only, create durable run state, spawn a fresh coordinator for each outer round, bind review and validation to exact Git trees, gate fixes through verification and independent triage, publish each repaired round, and stop only after a fresh zero-finding confirmation or an explicit capped outcome."
