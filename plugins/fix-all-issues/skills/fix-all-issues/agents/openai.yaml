interface:
  display_name: "Fix All Issues"
  short_description: "Bounded PR review with exact-tree evidence and durable issue routes."
  default_prompt: "Use $fix-all-issues in exhaustive mode. Keep the main agent orchestration-only, create one exact-tree evidence packet per candidate, refresh workers at outer-round boundaries, reuse a small fixed pool inside each round, attribute every verified finding, fix all in-envelope responsibility, route adjacent issues durably, consolidate repeated root causes, validate only after cold zero-claim confirmation, publish each repaired round, and stop with the exact clean, scope-routed, blocked, stabilized, or capped terminal state."
