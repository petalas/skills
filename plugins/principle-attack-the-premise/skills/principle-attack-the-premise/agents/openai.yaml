interface:
  display_name: "principle-attack-the-premise"
  short_description: "Apply when two or more fixes that share one premise have failed the same gate. Take a census of which actors hold the imbalance before the next fix, then question the premise instead of writing another fix that assumes it."
  default_prompt: "Use $principle-attack-the-premise for this task."

policy:
  allow_implicit_invocation: false
