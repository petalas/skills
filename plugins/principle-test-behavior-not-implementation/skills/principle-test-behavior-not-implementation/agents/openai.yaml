interface:
  display_name: "principle-test-behavior-not-implementation"
  short_description: "Apply when you write, change, or keep a test. Assert what the code's users can observe, so that the test fails when that behavior breaks and keeps passing when only the internals change."
  default_prompt: "Use $principle-test-behavior-not-implementation for this task."

policy:
  allow_implicit_invocation: false
