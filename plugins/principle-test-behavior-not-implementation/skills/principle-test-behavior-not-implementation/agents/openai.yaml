interface:
  display_name: "principle-test-behavior-not-implementation"
  short_description: "Apply when you write, change, or keep a test. Call the code the way its users do and assert the result they observe against a literal expected value. If the test would still pass when every imported function returns undefined, rewrite the assertion or delete the test."
  default_prompt: "Use $principle-test-behavior-not-implementation for this task."

policy:
  allow_implicit_invocation: false
